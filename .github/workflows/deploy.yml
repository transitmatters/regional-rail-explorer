name: deploy

on:
  push:
    branches:
      - main

# One deploy at a time, and never cancel one mid-stack-update
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # arm64 to match the arm64 Lambda, so the bundled sharp binary is the right one
    runs-on: ubuntu-24.04-arm
    env:
      TM_RRE_RR_RKS_CERT_ARN: ${{ secrets.TM_RRE_RR_RKS_CERT_ARN }}
      TM_LABS_WILDCARD_CERT_ARN: ${{ secrets.TM_LABS_WILDCARD_CERT_ARN }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Node via mise
        uses: jdx/mise-action@v5
      - name: Set up CI Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Generate AWS profile
        run: |
          mkdir ~/.aws
          cat >> ~/.aws/credentials << EOF
          [transitmatters]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF
      - name: Check if package-lock.json is up to date
        run: npx --yes package-lock-utd@1.1.0
      - name: Install app dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      # release/ is the Lambda's code as-is: Lambda runs `node server.js` from it
      - name: Package release
        run: bash devops/package-release.sh
      - name: Run deploy shell script
        run: cd devops && bash ./deploy.sh -p
