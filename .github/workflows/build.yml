name: build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    # arm64 to match the arm64 Lambda, so the bundled sharp binary is the right one
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Node via mise
        uses: jdx/mise-action@v5
      - name: Set up CI Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Check if package-lock.json is up to date
        run: |
          npx --yes package-lock-utd@1.1.0
      - name: Install app dependencies
        run: npm ci
      - name: Fully build application
        run: npm run build
      # Checks that scenarios.json rebuilds the same network and routes the same journeys
      - name: Run tests
        run: npm test
