<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Read by the fontconfig inside sharp's libvips (FONTCONFIG_PATH=/var/task/fonts), so the
     summary card's SVG text has glyphs to render on Lambda, which has no system fonts.
     The card is laid out for Times; Liberation Serif has the same metrics. -->
<fontconfig>
  <dir>/var/task/fonts</dir>
  <!-- /var/task is read-only on Lambda; /tmp is the only writable place -->
  <cachedir>/tmp/fontconfig</cachedir>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Times</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
</fontconfig>
