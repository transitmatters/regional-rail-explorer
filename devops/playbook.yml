---
- name: deploy RRE on EC2
  hosts: all
  remote_user: ubuntu
  become_user: ubuntu

  # The host only runs the app. CI builds a Next standalone bundle (server, traced
  # node_modules, static assets, scenarios.json) into release/ and we ship that here,
  # so nothing is cloned, installed or built on this small box.
  vars:
    app_dir: /home/ubuntu/regional-rail-explorer
    git_sha: "{{ lookup('env', 'GIT_SHA') }}"
    release_dir: "{{ app_dir }}/releases/{{ git_sha }}"
    # Runs mapScenarios in getServerSideProps, so it fails if scenarios.json is missing or broken
    health_url: http://127.0.0.1:5000/station/place-sstat
    releases_to_keep: 3

    # Read by the datadog.dd.agent role. Adds one Datadog infrastructure host (about
    # $15/month at the Pro list price) plus log ingestion, which is small at this
    # traffic. APM and network monitoring are off to save cost and memory on this box.
    datadog_api_key: "{{ lookup('env', 'DD_API_KEY') }}"
    datadog_site: "datadoghq.com"
    # So the agent can read the app's stdout from the systemd journal
    datadog_additional_groups:
      - systemd-journal
    datadog_config:
      # The agent's expvar server defaults to port 5000, which the app listens on
      expvar_port: 5050
      tags:
        - "git.repository_url:github.com/transitmatters/regional-rail-explorer"
        - "git.commit.sha:{{ git_sha }}"
        - "version:{{ git_sha }}"
      # The app has no dd-trace, so there's nothing to send traces
      apm_config:
        enabled: false
      process_config:
        enabled: "true" # type: string
      logs_enabled: true
    # No system_probe_config or network_config: the role then writes an empty
    # system-probe.yaml, so only system-probe-lite (~3MB) runs instead of the full
    # system-probe (~70MB). OOM kills still show up via kernel logs below.
    datadog_checks:
      journald:
        logs:
          # The app logs to stdout, which systemd sends to the journal
          - type: journald
            config_id: app
            include_units:
              - regional-rail-explorer.service
            service: "regional-rail-explorer"
            source: nodejs
          # Kernel messages, so OOM kills are visible without system-probe
          - type: journald
            config_id: kernel
            include_matches:
              - _TRANSPORT=kernel
            service: "regional-rail-explorer"
            source: kernel
      systemd:
        init_config:
        instances:
          - unit_names:
              - regional-rail-explorer.service

  tasks:
    # -- Host prep ---------------------------------------------------------

    - name: Create swap file
      become: yes
      become_user: root
      command: dd if=/dev/zero of=/extraswap bs=1M count=2048
      args:
        creates: /extraswap

    - name: Make sure swap file has the right permissions
      become: yes
      become_user: root
      file:
        path: /extraswap
        mode: "0600"

    # Keyed off whether the file is already active swap rather than whether we just
    # created it: mkswap refuses on an active swap file, and this also recovers a
    # file a previous deploy created but never formatted.
    - name: Check whether the swap file is already active
      become: yes
      become_user: root
      command: swapon --show=NAME --noheadings
      register: active_swap
      changed_when: false

    - name: Run mkswap
      become: yes
      become_user: root
      command: mkswap /extraswap
      when: "'/extraswap' not in active_swap.stdout"

    - name: Add swap to fstab
      become: yes
      become_user: root
      lineinfile:
        dest: /etc/fstab
        regexp: extraswap
        line: /extraswap none swap sw 0 0
        state: present

    - name: Turn swap on
      become: yes
      become_user: root
      command: swapon -a
      changed_when: false

    # Prefer dropping page cache over swapping out the app's heap
    - name: Lower swappiness
      become: yes
      become_user: root
      sysctl:
        name: vm.swappiness
        value: "10"
        sysctl_file: /etc/sysctl.d/60-swappiness.conf

    # The Ubuntu Minimal image leaves out rsync, which the release sync below needs
    - name: Install rsync
      become: yes
      become_user: root
      apt:
        name: rsync
        update_cache: yes

    # The summary card (link preview image) is an SVG rendered by sharp, whose text falls
    # back to fontconfig's default serif. Without fonts it renders every glyph as a box.
    # Liberation Serif has the same metrics as Times, which the card was laid out with.
    - name: Install fonts for the summary card
      become: yes
      become_user: root
      apt:
        name:
          - fontconfig
          - fonts-liberation
        install_recommends: no

    - name: Create the journald drop-in directory
      become: yes
      become_user: root
      file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"

    - name: Cap journald's disk and memory use
      become: yes
      become_user: root
      copy:
        dest: /etc/systemd/journald.conf.d/size.conf
        content: |
          [Journal]
          SystemMaxUse=100M
          RuntimeMaxUse=32M
      register: journald_conf

    - name: Restart journald on its new limits
      become: yes
      become_user: root
      systemd_service:
        name: systemd-journald
        state: restarted
      when: journald_conf.changed

    - name: Add nodejs 26.x ppa for apt repo
      become: yes
      become_user: root
      shell: curl -fsSL https://deb.nodesource.com/setup_26.x | bash -

    # state: latest so an existing install from an older major gets upgraded
    - name: Install nodejs
      become: yes
      become_user: root
      apt:
        name: nodejs
        state: latest

    - name: Install the Datadog Agent
      become: yes
      become_user: root
      import_role:
        name: datadog.dd.agent

    # Restart the agent on its new config now rather than at the end of the play,
    # so it has let go of the app's port before the app starts and is health checked.
    - name: Apply Datadog Agent config changes
      meta: flush_handlers

    # -- Web tier ----------------------------------------------------------

    - name: Install nginx
      become: yes
      become_user: root
      apt:
        name: nginx

    - name: copy nginx config file
      become: yes
      become_user: root
      copy:
        src: nginx.conf
        dest: /etc/nginx/sites-enabled/default

    # Reloaded every run rather than via a handler, so a deploy that fails after
    # writing the config can't leave nginx on the old one forever.
    - name: Reload nginx
      become: yes
      become_user: root
      systemd_service:
        name: nginx
        state: reloaded
      changed_when: false

    # -- Release -----------------------------------------------------------

    - name: Find the release currently being served
      stat:
        path: "{{ app_dir }}/current"
      register: current_link

    - name: Record the previous release
      set_fact:
        previous_release: "{{ current_link.stat.lnk_source if (current_link.stat.islnk | default(false)) else '' }}"

    - name: Create the release directory
      file:
        path: "{{ release_dir }}"
        state: directory
        mode: "0755"

    - name: Ship the built release from the runner
      synchronize:
        src: "{{ playbook_dir }}/../release/"
        dest: "{{ release_dir }}/"
        delete: yes

    - name: copy systemd service file
      become: yes
      become_user: root
      template:
        src: systemd.conf
        dest: /etc/systemd/system/regional-rail-explorer.service

    - name: Switch to the new release and verify it serves
      block:
        - name: Point current at the new release
          file:
            src: "{{ release_dir }}"
            dest: "{{ app_dir }}/current"
            state: link
            force: yes

        - name: Make sure a service unit is running and enabled
          become: yes
          become_user: root
          systemd_service:
            name: regional-rail-explorer
            state: started
            enabled: true
            daemon_reload: true

        - name: restart service
          become: yes
          become_user: root
          systemd_service:
            name: regional-rail-explorer
            state: restarted
            daemon_reload: true

        - name: Wait for the app to serve a scenario page
          uri:
            url: "{{ health_url }}"
            status_code: 200
            timeout: 30
          register: health
          until: health.status == 200
          retries: 20
          delay: 3

      rescue:
        - name: Roll back to the previous release
          when: previous_release | length > 0 and previous_release != release_dir
          block:
            - name: Point current back at the previous release
              file:
                src: "{{ previous_release }}"
                dest: "{{ app_dir }}/current"
                state: link
                force: yes

            - name: Restart on the previous release
              become: yes
              become_user: root
              systemd_service:
                name: regional-rail-explorer
                state: restarted

            - name: Wait for the rolled-back app to serve
              uri:
                url: "{{ health_url }}"
                status_code: 200
                timeout: 30
              register: rollback_health
              until: rollback_health.status == 200
              retries: 20
              delay: 3

        - name: Fail the deploy
          fail:
            msg: >-
              {{ git_sha }} failed its health check.
              {{ ('Rolled back to ' + previous_release + '.')
                 if previous_release | length > 0 and previous_release != release_dir
                 else 'There was no previous release to roll back to.' }}

    # -- Cleanup -----------------------------------------------------------

    # Only reached after a successful deploy, so the served release is always kept
    - name: Prune old releases
      shell: |
        set -euo pipefail
        cd {{ app_dir }}/releases
        ls -1t | { grep -vx '{{ git_sha }}' || true; } | tail -n +{{ releases_to_keep }} | while read -r old; do
          echo "removed $old"
          rm -rf -- "$old"
        done
      args:
        executable: /bin/bash
      register: prune
      changed_when: "'removed ' in prune.stdout"

    # Deploys used to git clone and npm ci into app_dir; clear that out now that
    # only releases/ and current/ are used.
    - name: Remove the legacy checkout
      shell: |
        set -euo pipefail
        find {{ app_dir }} -mindepth 1 -maxdepth 1 ! -name releases ! -name current -print -exec rm -rf {} +
      args:
        executable: /bin/bash
      register: legacy_cleanup
      changed_when: legacy_cleanup.stdout | length > 0
