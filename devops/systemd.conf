[Unit]
Description=regional-rail-explorer
After=network.target

[Service]
Type=simple
User=ubuntu
Group=ubuntu
# A symlink to the active release in releases/, swapped by the playbook
WorkingDirectory=/home/ubuntu/regional-rail-explorer/current
Environment=DD_SERVICE="regional-rail-explorer"
Environment=DD_ENV="prod"
Environment=DD_VERSION="{{ git_sha }}"
Environment=DD_GIT_COMMIT_SHA="{{ git_sha }}"
Environment=DD_GIT_REPOSITORY_URL="github.com/transitmatters/regional-rail-explorer"
ExecStart=/usr/bin/node server.js
Restart=always
RestartSec=5s
# Reclaim the app's page cache past MemoryHigh, and restart it past MemoryMax rather
# than letting it push the whole host into swap. It peaks around 450MB today.
MemoryHigh=500M
MemoryMax=650M

Environment="NODE_ENV=production"
Environment="PORT=5000"
# nginx is the only public listener
Environment="HOSTNAME=127.0.0.1"

[Install]
WantedBy=multi-user.target
